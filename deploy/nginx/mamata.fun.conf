# Site do jogo Mamata (Flutter Web) — independente dos outros sites da VPS.
# Instalar em /etc/nginx/sites-available/mamata.fun e ativar com link em sites-enabled.
# O HTTPS (porta 443) é adicionado depois pelo certbot neste mesmo arquivo.

server {
    listen 80;
    listen [::]:80;
    server_name mamata.fun www.mamata.fun;

    root /var/www/mamata.fun;
    index index.html;

    # Arquivos que mudam a cada versão publicada: o navegador deve sempre revalidar.
    location ~* (index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache";
    }

    # Áudio e fonte com o tipo correto (o mime.types padrão não tem .wav; o Safari exige).
    location ~* \.wav$ {
        types { } default_type audio/wav;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location ~* \.ttf$ {
        types { } default_type font/ttf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Motor do Flutter, fontes, áudio e imagens: cache de 7 dias.
    location ~* \.(js|mjs|wasm|ttf|otf|wav|png|ico|json|symbols)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript application/wasm application/json
               text/css image/svg+xml font/ttf font/otf;
}
